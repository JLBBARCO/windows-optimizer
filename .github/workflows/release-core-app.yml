name: Publish Core App Release

on:
    push:
        branches:
            - main
            - beta

concurrency:
    group: release-core-app-${{ github.ref_name }}
    cancel-in-progress: false

permissions:
    contents: write

jobs:
    # The application is executed directly from the source code of each release
    # (core-app/run.ps1 downloads the tag archive), so this workflow only keeps
    # .github/version.json in sync and publishes the release/pre-release. There
    # is no compilation step.
    publish-release:
        if: github.actor != 'github-actions[bot]'
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Resolve version and update version.json when needed
              id: meta
              shell: pwsh
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  $script = @'
                  import datetime
                  import json
                  import os
                  import re
                  import urllib.request

                  VERSION_FILE = ".github/version.json"
                  RE_TAG = re.compile(r"^v(\d+)\.(\d+)\.(\d+)$")

                  def parse_tag(tag: str):
                      if not tag:
                          return None
                      m = RE_TAG.match(tag.strip())
                      if not m:
                          return None
                      return tuple(int(x) for x in m.groups())

                  def fmt_tag(parts):
                      return f"v{parts[0]}.{parts[1]}.{parts[2]}"

                  def bump_patch(parts):
                      return (parts[0], parts[1], parts[2] + 1)

                  branch = os.environ["GITHUB_REF_NAME"].strip()
                  channel = "release" if branch == "main" else "pre-release"
                  is_prerelease = channel == "pre-release"
                  repo = os.environ["GITHUB_REPOSITORY"].strip()
                  token = os.environ["GITHUB_TOKEN"].strip()

                  with open(VERSION_FILE, "r", encoding="utf-8") as fh:
                      data = json.load(fh)

                  base_tag = str(data.get(channel, {}).get("version", "")).strip()
                  base_tuple = parse_tag(base_tag)

                  req = urllib.request.Request(
                      f"https://api.github.com/repos/{repo}/releases?per_page=100",
                      headers={
                          "Accept": "application/vnd.github+json",
                          "Authorization": f"Bearer {token}",
                          "User-Agent": "github-actions-release-workflow",
                      },
                  )

                  with urllib.request.urlopen(req) as response:
                      releases = json.loads(response.read().decode("utf-8"))

                  existing_tags = set()
                  channel_versions = []

                  for rel in releases:
                      tag = str(rel.get("tag_name", "")).strip()
                      parts = parse_tag(tag)
                      if not parts:
                          continue

                      existing_tags.add(tag)

                      if bool(rel.get("draft", False)):
                          continue

                      if is_prerelease and bool(rel.get("prerelease", False)):
                          channel_versions.append(parts)
                      if (not is_prerelease) and (not bool(rel.get("prerelease", False))):
                          channel_versions.append(parts)

                  latest_channel = max(channel_versions) if channel_versions else None

                  changed = False

                  if base_tuple is None:
                      candidate = bump_patch(latest_channel) if latest_channel else (0, 1, 0)
                  else:
                      candidate = base_tuple

                  if fmt_tag(candidate) in existing_tags:
                      start = latest_channel or candidate
                      if candidate > start:
                          start = candidate
                      candidate = bump_patch(start)
                      while fmt_tag(candidate) in existing_tags:
                          candidate = bump_patch(candidate)

                  selected_tag = fmt_tag(candidate)

                  if base_tag != selected_tag:
                      data[channel]["version"] = selected_tag
                      changed = True

                  today = datetime.datetime.now().strftime("%d-%m-%Y")
                  if str(data[channel].get("release_date", "")).strip() != today:
                      data[channel]["release_date"] = today
                      changed = True

                  if changed:
                      with open(VERSION_FILE, "w", encoding="utf-8") as fh:
                          json.dump(data, fh, indent=2)
                          fh.write("\n")

                  output_file = os.environ["GITHUB_OUTPUT"]
                  with open(output_file, "a", encoding="utf-8") as out:
                      out.write(f"channel={channel}\n")
                      out.write(f"tag={selected_tag}\n")
                      out.write(f"release_name=Windows Optimizer {selected_tag}\n")
                      out.write(f"is_prerelease={'true' if is_prerelease else 'false'}\n")
                      out.write(f"version_file_changed={'true' if changed else 'false'}\n")
                  '@

                  python -c $script

            - name: Commit updated version.json
              if: steps.meta.outputs.version_file_changed == 'true'
              shell: pwsh
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add .github/version.json
                  git diff --cached --quiet
                  if ($LASTEXITCODE -ne 0) {
                    git commit -m "chore(release): bump ${{ steps.meta.outputs.channel }} to ${{ steps.meta.outputs.tag }} [skip ci]"
                    git push
                  }

            - name: Publish GitHub release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.meta.outputs.tag }}
                  name: ${{ steps.meta.outputs.release_name }}
                  prerelease: ${{ steps.meta.outputs.is_prerelease }}
                  target_commitish: ${{ github.ref_name }}
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
